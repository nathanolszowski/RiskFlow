{% extends "core/app_layout.html" %}

{% block page_title %}Clients{% endblock page_title %}

{% block app_content %}
<div class="w-full max-w-7xl px-4 sm:px-6 lg:px-8">

  <!-- Header -->
  <div class="sm:flex sm:items-center sm:justify-between mb-8">
    <div>
      <p class="mt-2 text-sm text-text-subtle">Gestion de votre portefeuille clients et entreprises.</p>
    </div>
    <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
      <button type="button" hx-get="{% url 'crm:create_company' %}" hx-target="#modal-container" hx-swap="innerHTML"
        class="block rounded-md bg-brand-primary px-3.5 py-2 text-center text-sm font-semibold text-white hover:bg-brand-hover cursor-pointer transition-colors">
        Nouveau client
      </button>
    </div>
  </div>

  <!-- Toolbar -->
  <div
    class="mb-8 px-6 bg-surface-primary border border-border-default rounded-2xl p-4 backdrop-blur-xs flex flex-col gap-4 transition-colors">
    <div class="flex items-center justify-between">
      <h2 class="text-xl font-bold text-text-main tracking-tight">Clients</h2>
    </div>

    <form method="GET" action="." class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">

      <!-- Research -->
      <div class="flex flex-col gap-1.5">
        <label for="q" class="text-xs font-semibold text-text-muted uppercase tracking-wider">Recherche</label>
        <div class="relative">
          <input type="text" name="q" id="q" value="{{ request.GET.q|default:'' }}"
            placeholder="Raison sociale, SIREN..."
            class="w-full bg-surface-secondary border border-border-default text-text-main text-sm rounded-lg focus:border-brand-primary focus:outline-none focus:ring-1 focus:ring-brand-primary block pl-9 pr-3 py-2 placeholder-text-faded outline-none transition-colors">
          <svg class="w-4 h-4 text-text-faded absolute left-3 top-2.5" fill="none" stroke="currentColor"
            viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>

      <!-- Filters -->
      <div class="flex flex-col gap-1.5">
        <label for="status" class="text-xs font-semibold text-text-muted uppercase tracking-wider">État</label>
        <select name="status" id="status"
          class="bg-surface-secondary border border-border-default text-text-body text-sm rounded-lg focus:border-brand-primary focus:outline-none focus:ring-1 focus:ring-brand-primary block px-3 py-2 cursor-pointer outline-none transition-colors w-full">
          <option value="">Toutes les sociétés</option>
          <option value="active" {% if request.GET.status == 'active' or not request.GET.status %}selected{% endif %}>Actives uniquement</option>
          <option value="archived" {% if request.GET.status == 'archived' %}selected{% endif %}>Archivées uniquement
          </option>
        </select>
      </div>

      <!-- Sort -->
      <div class="flex flex-col gap-1.5">
        <label for="sort" class="text-xs font-semibold text-text-muted uppercase tracking-wider">Trier par</label>
        <select name="sort" id="sort"
          class="bg-surface-secondary border border-border-default text-text-body text-sm rounded-lg focus:border-brand-primary focus:outline-none focus:ring-1 focus:ring-brand-primary block px-3 py-2 cursor-pointer outline-none transition-colors w-full">
          <option value="name" {% if request.GET.sort == 'name' or not request.GET.sort %}selected{% endif %}>Raison sociale (A-Z)</option>
          <option value="-created_at" {% if request.GET.sort == '-created_at' %}selected{% endif %}>Récemment ajoutées
          </option>
          <option value="-inspection_folders_count" {% if request.GET.sort == '-inspection_folders_count' %}selected{%endif %}>Nombre de dossiers</option>
        </select>
      </div>

      <!-- Submit button -->
      <div class="flex items-center">
        <button type="submit"
          class="bg-brand-primary hover:bg-brand-hover text-white font-medium text-xs rounded-lg px-3.5 py-2 transition-colors h-[38px] self-end cursor-pointer">
          Filtrer
        </button>
      </div>

    </form>
  </div>

  <div id="company-grid-container">
    {% include "crm/partials/company_grid.html" %}
  </div>

  <div id="modal-container"></div>

</div>
{% endblock app_content %}
