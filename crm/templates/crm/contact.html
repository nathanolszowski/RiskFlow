{% extends "core/app_layout.html" %}

{% block page_title %}Contacts{% endblock page_title %}

{% block app_content %}

<div class="space-y-6">

    <!-- Header -->
    <div class="sm:flex sm:items-center sm:justify-between mb-8">
        <div>
            <p class="mt-2 text-sm text-gray-400">Gestion de votre portefeuille clients et entreprises.</p>
        </div>
        <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
            <button type="button" 
                    hx-get="{% url 'crm:create_contact' %}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    class="block rounded-md bg-indigo-600 px-3.5 py-2 text-center text-sm font-semibold text-white hover:bg-indigo-500 cursor-pointer transition-colors">
                + Nouveau contact
            </button>
        </div>
    </div>

    <!-- Filters & Research HTMX -->
    <div class="rounded-xl border border-gray-800 bg-gray-900 p-4 shadow-sm">
        <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            
            <div class="relative flex-1 max-w-md">
                <input type="text"
                       name="q"
                       placeholder="Rechercher par nom, email, société..."
                       value="{{ request.GET.q|default:'' }}"
                       hx-get="{% url 'crm:contact_list_paginated' page=1 %}"
                       hx-target="#contact-cards-container"
                       hx-include="[name='company']"
                       hx-trigger="keyup changed delay:300ms, search"
                       hx-indicator="#search-spinner"
                       class="w-full rounded-lg border border-gray-700 bg-gray-800 p-2.5 pl-9 text-sm text-gray-100 placeholder-gray-500 focus:border-indigo-500 focus:ring-indigo-500">
                
                <svg class="absolute left-3 top-3 h-4 w-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>

                <!-- Spinner HTMX -->
                <div id="search-spinner" class="htmx-indicator absolute right-3 top-3">
                    <svg class="h-4 w-4 animate-spin text-indigo-400" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </div>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap items-center gap-2">
                <select name="company"
                        hx-get="{% url 'crm:contact_list_paginated' page=1 %}"
                        hx-target="#contact-cards-container"
                        hx-include="[name='q']"
                        class="rounded-lg border border-gray-700 bg-gray-800 px-3 py-2 text-xs text-gray-200 focus:border-indigo-500 focus:ring-indigo-500">
                    <option value="">Toutes les sociétés</option>
                    {% for company in companies %}
                        <option value="{{ company.id }}">{{ company.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- Dynamic HTMX container-->
    <div id="contact-cards-container">
        {% include "crm/partials/contact_grid.html" %}
    </div>

    <div id="modal-container"></div>

</div>
{% endblock app_content %}
