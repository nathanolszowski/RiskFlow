{% extends "core/app_layout.html" %}

{% block page_title %}Contacts{% endblock page_title %}
{% block page_subtitle %}Gestion de vos contacts clients{% endblock page_subtitle %}

{% block app_content %}
<div class="w-full max-w-7xl px-4 sm:px-6 lg:px-8">

  <!-- Action Header -->
  <div class="flex items-center justify-end mb-6">
    <button type="button" hx-get="{% url 'crm:create_contact' %}" hx-target="#modal-container" hx-swap="innerHTML"
      class="inline-flex items-center gap-2 rounded-xl bg-brand-primary px-4 py-2.5 text-xs font-semibold text-white hover:bg-brand-hover transition-colors shadow-sm cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nouveau contact
    </button>
  </div>

  <!-- Toolbar HTMX Filters & Search -->
  <div class="mb-8 bg-surface-primary border border-border-default rounded-2xl p-5 shadow-xs transition-colors">
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 items-end">

      <!-- Research (HTMX keyup/changed with 300ms delay) -->
      <div class="sm:col-span-2 flex flex-col gap-1.5">
        <label for="q" class="text-[11px] font-semibold text-text-muted uppercase tracking-wider">Recherche</label>
        <div class="relative">
          <input type="text" name="q" id="q" value="{{ request.GET.q|default:'' }}"
            placeholder="Rechercher par nom, email, poste..." hx-get="{% url 'crm:contact_list_paginated' page=1 %}"
            hx-target="#contact-cards-container" hx-include="[name='company']"
            hx-trigger="keyup changed delay:300ms, search" hx-indicator="#search-spinner"
            class="w-full bg-surface-secondary border border-border-default text-text-main text-xs rounded-lg focus:border-brand-primary focus:outline-none focus:ring-1 focus:ring-brand-primary block pl-9 pr-9 py-2 placeholder:text-text-muted transition-colors">

          <svg class="w-4 h-4 text-text-muted absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>

          <!-- Spinner HTMX -->
          <div id="search-spinner" class="htmx-indicator absolute right-3 top-2.5">
            <svg class="h-4 w-4 animate-spin text-brand-primary" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
              </path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Filter Company -->
      <div class="flex flex-col gap-1.5">
        <label for="company" class="text-[11px] font-semibold text-text-muted uppercase tracking-wider">Société</label>
        <select name="company" id="company" hx-get="{% url 'crm:contact_list_paginated' page=1 %}"
          hx-target="#contact-cards-container" hx-include="[name='q']"
          class="bg-surface-secondary border border-border-default text-text-main text-xs rounded-lg focus:border-brand-primary focus:outline-none focus:ring-1 focus:ring-brand-primary block px-3 py-2 cursor-pointer transition-colors w-full">
          <option value="">Toutes les sociétés</option>
          {% for company in companies %}
          <option value="{{ company.id }}" {% if request.GET.company == company.id|stringformat:"i" %}selected{% endif %}>
            {{ company.name }}
          </option>
          {% endfor %}
        </select>
      </div>

    </div>
  </div>

  <!-- Dynamic HTMX container -->
  <div id="contact-cards-container">
    {% include "crm/partials/contact_grid.html" %}
  </div>

  <div id="modal-container"></div>

</div>
{% endblock app_content %}
