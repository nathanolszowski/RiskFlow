<!-- Folders of a company, loaded by the company detail page (crm) -->
<div id="company-folders-panel" class="bg-surface-primary border border-border-default rounded-2xl p-5 backdrop-blur-xs space-y-5 transition-colors">
  <div class="flex items-center justify-between border-b border-border-default pb-4">
    <div class="flex items-center gap-2.5">
      <h2 class="text-base font-bold text-text-main tracking-tight">Dossiers d'inspection liés</h2>
      <span class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold rounded-full bg-brand-primary/10 border border-brand-primary/20 text-brand-light">
        {{ folders|length }}
      </span>
    </div>

    <button type="button" hx-get="{% url 'inspections:create_folder' %}?company={{ company.id }}"
      hx-target="#modal-container" hx-swap="innerHTML"
      class="inline-flex items-center gap-1.5 rounded-lg bg-brand-primary hover:bg-brand-hover px-3 py-1.5 text-xs font-semibold text-brand-on shadow-xs transition-colors cursor-pointer shrink-0">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Nouveau dossier
    </button>
  </div>

  <div class="space-y-3">
    {% for folder in folders %}
      <div class="group flex items-center justify-between p-3.5 rounded-xl bg-surface-secondary/50 border border-border-default/60 hover:border-border-default transition-colors {% if not folder.is_active %}opacity-60{% endif %}">
        <div class="space-y-1 min-w-0 pr-3">
          <a href="{% url 'inspections:folder_detail' folder.pk %}" class="text-sm font-semibold text-text-main group-hover:text-brand-light transition-colors truncate">
            {{ folder.reference }}
          </a>
          <div class="flex items-center gap-2 text-xs text-text-faded">
            <span>{{ folder.get_current_phase_display }}{% if not folder.is_active %} · archivé{% endif %}</span>
            <span>• {{ folder.created_at|date:"d/m/Y" }}</span>
          </div>
        </div>

        <a href="{% url 'inspections:folder_detail' folder.pk %}"
          class="p-1.5 text-text-subtle hover:text-text-main bg-surface-tertiary hover:bg-surface-secondary border border-border-default rounded-lg transition-colors shrink-0"
          title="Voir le dossier">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>
    {% empty %}
      <div class="text-center py-6 text-sm text-text-faded">
        Aucun dossier d'inspection lié à ce client.
      </div>
    {% endfor %}
  </div>
</div>
