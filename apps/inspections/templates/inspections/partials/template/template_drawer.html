{# Side panel of the visit templates (overlay + panel). Content: template_panel.html, template_editor.html. #}
<div id="template-drawer" class="fixed inset-0 z-40">
  <div class="absolute inset-0 bg-black/50" onclick="document.getElementById('template-drawer').remove()"></div>
  <aside aria-label="Templates de visite"
    class="absolute inset-y-0 right-0 flex w-full flex-col border-l border-border-hover bg-surface-primary p-6 shadow-2xl transition-[width] sm:w-[500px] sm:has-[[data-wide]]:w-[800px]">
    <div id="template-drawer-content" class="flex min-h-0 flex-1 flex-col gap-4">
      {% include "inspections/partials/template/template_panel.html" %}
    </div>
  </aside>
</div>
