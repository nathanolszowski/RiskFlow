{# List view of the side panel. Context: scope, q, folder_id, templates, mine_count, shared_count. #}
<div class="flex items-center justify-between gap-3">
  <h2 class="text-xl font-semibold text-text-main">Templates de visite</h2>
  <button type="button" onclick="document.getElementById('template-drawer').remove()" aria-label="Fermer"
    class="inline-flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg border border-border-default bg-surface-secondary text-text-muted transition-colors hover:text-text-main">
    <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<div class="flex gap-1.5 rounded-xl border border-border-default bg-surface-secondary p-1" hx-target="#template-drawer-content" hx-swap="innerHTML">
  <button type="button" hx-get="{% url 'inspections:template_panel' %}?scope=mine{% if folder_id %}&folder={{ folder_id }}{% endif %}"
    aria-pressed="{% if scope == 'mine' %}true{% else %}false{% endif %}"
    class="h-10 flex-1 cursor-pointer rounded-lg text-sm font-semibold transition-colors {% if scope == 'mine' %}bg-brand-primary text-brand-on{% else %}text-text-muted hover:text-text-main{% endif %}">
    Mes templates · {{ mine_count }}
  </button>
  <button type="button" hx-get="{% url 'inspections:template_panel' %}?scope=shared{% if folder_id %}&folder={{ folder_id }}{% endif %}"
    aria-pressed="{% if scope == 'shared' %}true{% else %}false{% endif %}"
    class="h-10 flex-1 cursor-pointer rounded-lg text-sm font-semibold transition-colors {% if scope == 'shared' %}bg-brand-primary text-brand-on{% else %}text-text-muted hover:text-text-main{% endif %}">
    Partagés avec moi · {{ shared_count }}
  </button>
</div>

<input type="search" name="q" value="{{ q }}" placeholder="Rechercher un template…" autocomplete="off"
  hx-get="{% url 'inspections:template_panel' %}" hx-trigger="input changed delay:300ms, search"
  hx-target="#template-list" hx-swap="outerHTML"
  hx-vals='{"scope": "{{ scope }}", "folder": "{{ folder_id|default:"" }}"}'
  class="form-input">

{% include "inspections/partials/template/template_list.html" %}

<button type="button" hx-get="{% url 'inspections:template_create' %}{% if folder_id %}?folder={{ folder_id }}{% endif %}"
  hx-target="#template-drawer-content" hx-swap="innerHTML"
  class="inline-flex h-12 cursor-pointer items-center justify-center gap-2 rounded-xl bg-brand-primary text-sm font-bold text-brand-on shadow-xs transition-colors hover:bg-brand-hover">
  <svg class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  Créer un template
</button>
