[project]
name = "riskflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.6",
    "django-htmx>=1.27.0",
    "django-json-widget>=2.1.1",
    "django-storages[s3]>=1.14.6",
    "django-tailwind[cookiecutter,honcho,reload]>=4.5.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "django-stubs>=6.1.2",
    "factory-boy>=3.3.3",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["**/migrations/*"]   # migrations générées par Django, à ne pas reformater

[tool.ruff.lint]
select = ["E", "F", "I", "RUF100", "TC"]  # erreurs, pyflakes, tri des imports, noqa inutiles, imports de typage sous TYPE_CHECKING
ignore = ["E501"]                      # longueur de ligne : gérée par le formateur, il ne coupe pas les chaînes

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]  # `from .base import *` voulu

[tool.ruff.lint.pydocstyle]
convention = "google"  # style des docstrings ; le contrôle D1 est lancé à part sur les tests

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
