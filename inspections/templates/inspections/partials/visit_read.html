<div id="visit-info" class="border-b border-border-default pb-4 space-y-3">
    <div class="flex justify-between items-start gap-4">
        <div>
            <h3 class="text-lg font-bold text-text-main">{{ visit.template.name }}</h3>
            <p class="text-xs text-text-muted mt-0.5">Statut : {{ visit.get_current_status_display }}</p>
        </div>
        <div class="flex items-center gap-2.5 shrink-0">
            {% if visit.due_date %}
            <span
                class="text-xs font-mono text-text-subtle bg-surface-secondary border border-border-default px-3 py-2 rounded-lg">
                📅 {{ visit.due_date|date:"d/m/Y" }}
            </span>
            {% endif %}
            <button type="button" hx-get="{% url 'inspections:visit_inline_update' visit.pk %}" hx-target="#visit-info"
                hx-swap="outerHTML"
                class="inline-flex items-center gap-1.5 rounded-lg bg-brand-primary hover:bg-brand-hover px-3.5 py-2 text-xs font-semibold text-white shadow-xs transition-colors cursor-pointer whitespace-nowrap">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
                </svg>
                Éditer la visite
            </button>
        </div>
    </div>

    {% if visit.notes %}
    <p class="text-sm text-text-body whitespace-pre-line">{{ visit.notes }}</p>
    {% endif %}

    {% include "core/partials/tracking_line.html" with object=visit %}
</div>
