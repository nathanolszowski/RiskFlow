<div id="create-folder-modal" class="fixed inset-0 z-50 overflow-y-auto">
  <div class="flex min-h-screen items-center justify-center p-4 text-center">
    
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-gray-950/70 backdrop-blur-xs" onclick="document.getElementById('create-folder-modal').remove()"></div>

    <!-- Modal Content -->
    <div class="relative transform overflow-hidden rounded-2xl bg-gray-900 border border-gray-800 p-6 text-left shadow-2xl transition-all sm:w-full sm:max-w-md">
      <div class="mb-4">
        <h3 class="text-lg font-semibold text-white">Créer un dossier d'inspection</h3>
      </div>

      <form hx-post="{% url 'inspections:create_folder_htmx' %}" 
            {% if not form.initial.company %}hx-target="#folder-grid-container"{% endif %}
            hx-on::after-request="if(event.detail.successful) document.getElementById('create-folder-modal').remove()"
            class="space-y-4">
        {% csrf_token %}

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Référence unique</label>
          {{ form.reference }}
          {% if form.reference.errors %}
            <p class="text-xs text-red-400 mt-1">{{ form.reference.errors.0 }}</p>
          {% endif %}
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-300 mb-1">Sélectionner la société</label>
          {{ form.company }}
          {% if form.company.errors %}
            <p class="text-xs text-red-400 mt-1">{{ form.company.errors.0 }}</p>
          {% endif %}
        </div>

        <div class="mt-6 flex justify-end space-x-3 border-t border-gray-800/60 pt-4">
          <button type="button" 
                  onclick="document.getElementById('create-folder-modal').remove()" 
                  class="rounded-md bg-white/5 px-3 py-2 text-sm font-semibold text-gray-300 hover:bg-white/10 transition cursor-pointer">
            Annuler
          </button>
          <button type="submit" 
                  class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-xs hover:bg-indigo-500 transition cursor-pointer">
            Créer le dossier
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
