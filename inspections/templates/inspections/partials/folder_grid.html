{% if folders %}
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
    {% for folder in folders %}
      <div class="relative flex flex-col justify-between rounded-2xl border border-gray-800 bg-gray-900/40 p-6 backdrop-blur-xs">
        <div class="flex items-center justify-between gap-x-4 mb-4">
          <span class="font-mono text-xs font-semibold tracking-wider text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20">
            {{ folder.reference }}
          </span>
          <span class="inline-flex items-center rounded-md bg-blue-400/10 px-2 py-1 text-xs font-medium text-blue-400 ring-1 ring-inset ring-blue-400/30">{{ folder.get_current_phase_display }}</span>
        </div>
        <h3 class="text-xl font-bold tracking-tight text-white mb-1">{{ folder.client.name }}</h3>
        <p class="text-xs text-gray-500 mb-4">Siret : {{ folder.client.siret }}</p>
        <div class="mt-6 border-t border-gray-800/80 pt-4 flex items-center justify-between text-xs text-gray-400">
          <span>Modifié le {{ folder.updated_at|date:"d/m/Y" }}</span>
          <a href="{% url 'inspections:folder_tab_overview' folder.id %}" class="font-semibold text-white hover:text-indigo-400">Ouvrir</a>
        </div>
      </div>
    {% endfor %}
  </div>
{% else %}
  <div class="text-center py-16 border border-dashed border-gray-800 rounded-2xl">
    <p class="text-sm text-gray-500">Aucun dossier trouvé</p>
  </div>
{% endif %}
