{# Progress of a visit. Context: visit. #}
{% with progress=visit.progress %}
<div class="flex flex-col gap-1.5">
  <span class="text-xs text-text-subtle">{{ progress.done }} / {{ progress.total }} champs</span>
  <span class="h-1.5 overflow-hidden rounded-full bg-surface-tertiary">
    <span class="block h-full rounded-full bg-brand-primary" style="width: {{ progress.pct }}%"></span>
  </span>
</div>
{% endwith %}
