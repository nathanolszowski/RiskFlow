<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="lg:col-span-2 space-y-6">
        <div class="rounded-2xl border border-border-default bg-surface-primary p-6 backdrop-blur-xs transition-colors">
            <h3 class="text-lg font-bold text-text-main mb-4">📁 Informations du Dossier</h3>
            <p class="text-sm text-text-body">Réf : {{ folder.reference }}</p>
            <p class="text-sm text-text-body">Phase : {{ folder.get_current_phase_display }}</p>
        </div>

        <div class="rounded-2xl border border-border-default bg-surface-primary p-6 backdrop-blur-xs transition-colors">
            <h3 class="text-lg font-bold text-text-main mb-4">⚠️ Recommandations Actives</h3>
        </div>
    </div>

    <div class="lg:col-span-1">
        <div
            class="rounded-2xl border border-border-default bg-surface-primary p-6 backdrop-blur-xs h-full transition-colors">
            <h3 class="text-lg font-bold text-text-main mb-4">🏢 Informations Société</h3>
            <p class="text-sm text-text-main font-bold">{{ folder.company.name }}</p>
        </div>
    </div>
</div>
