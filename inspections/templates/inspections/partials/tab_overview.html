<!-- Traceability -->
<div class="mb-6">
    {% include "core/partials/tracking_info.html" with object=folder %}
</div>

<!-- Phase progress -->
<div class="mb-6">
    {% include "inspections/partials/folder_progress.html" %}
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

    <div class="lg:col-span-2 space-y-6">
        {% include "inspections/partials/folder_read.html" %}
    </div>

    <div class="lg:col-span-1">
        <div
            class="rounded-2xl border border-border-default bg-surface-primary p-6 backdrop-blur-xs h-full transition-colors">
            <h3 class="text-lg font-bold text-text-main mb-4">🏢 Informations Société</h3>
            <p class="text-sm text-text-main font-bold">{{ folder.company.name }}</p>

            <div class="pt-4">
                <a href="{% url 'crm:company_detail' folder.company.pk %}"
                    class="inline-flex items-center w-full justify-center px-3 py-2 text-xs font-medium text-brand-light bg-brand-bg border border-brand-border rounded-lg hover:bg-surface-tertiary transition-colors">
                    Voir la fiche client
                    <svg class="w-3.5 h-3.5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
</div>
