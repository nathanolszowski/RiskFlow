{% extends "core/app_layout.html" %}

{% block page_title %}Dossier {{ folder.reference }}{% endblock page_title %}

{% block app_content %}
<!-- Mobile dropdown navigation -->
<div class="sm:hidden mb-4">
  <label for="tabs" class="sr-only">Sélectionner un onglet</label>
  <select id="tabs" name="tabs"
    class="block w-full rounded-lg border-border-default bg-surface-secondary py-2 pl-3 pr-10 text-base text-text-main focus:border-brand-primary focus:outline-none focus:ring-1 focus:ring-brand-primary sm:text-sm"
    onchange="htmx.ajax('GET', this.value, {target: '#tab-content'})">
    <option value="{% url 'inspections:folder_tab_overview' folder.id %}">Vue d'ensemble</option>
    <option value="{% url 'inspections:folder_tab_visit' folder.id %}">Formulaire de visite</option>
    <option value="{% url 'inspections:folder_tab_recommandations' folder.id %}">Recommandations</option>
  </select>
</div>

<!-- Desktop Tab Bar -->
<div class="hidden sm:block mb-6" hx-on:click="
        let currentTab = event.target.closest('.tab-btn');
        if (currentTab) {
            document.querySelectorAll('.tab-btn').forEach(t => {
                t.classList.remove('border-brand-primary', 'text-brand-light');
                t.classList.add('border-transparent', 'text-text-subtle');
                t.querySelector('svg')?.classList.replace('text-brand-light', 'text-text-faded');
                let b = t.querySelector('.tab-badge');
                if(b) b.className = 'tab-badge ml-3 rounded-full bg-surface-secondary px-2.5 py-0.5 text-xs font-semibold text-text-subtle border border-border-default';
            });
            currentTab.classList.replace('border-transparent', 'border-brand-primary');
            currentTab.classList.replace('text-text-subtle', 'text-brand-light');
            currentTab.querySelector('svg')?.classList.replace('text-text-faded', 'text-brand-light');
            let ab = currentTab.querySelector('.tab-badge');
            if(ab) ab.className = 'tab-badge ml-3 rounded-full bg-brand-bg px-2.5 py-0.5 text-xs font-semibold text-brand-light border border-brand-border';
        }
     ">
  <div class="border-b border-border-default">
    <nav class="-mb-px flex space-x-8" aria-label="Tabs" hx-target="#tab-content" hx-swap="innerHTML">

      <!-- Overview-->
      <button hx-get="{% url 'inspections:folder_tab_overview' folder.id %}"
        class="tab-btn group inline-flex items-center border-b-2 border-brand-primary px-1 pb-4 text-sm font-medium text-brand-light transition-colors cursor-pointer"
        aria-current="page">
        <svg class="mr-2 h-5 w-5 text-brand-light transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 12.75V12A2.25 2.25 0 0 1 4.5 9.75h15A2.25 2.25 0 0 1 21.75 12v.75m-8.69-6.44-2.12-2.12a1.5 1.5 0 0 0-1.061-.44H4.5A2.25 2.25 0 0 0 2.25 6v12a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9a2.25 2.25 0 0 0-2.25-2.25h-5.379a1.5 1.5 0 0 1-1.06-.44Z" />
        </svg>
        <span>Vue d'ensemble</span>
      </button>

      <!-- Visit -->
      <button hx-get="{% url 'inspections:folder_tab_visit' folder.id %}"
        class="tab-btn group inline-flex items-center border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-text-subtle hover:border-border-hover hover:text-text-main transition-colors cursor-pointer">
        <svg class="mr-2 h-5 w-5 text-text-faded transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.03 0 1.9.732 2.076 1.704m-5.8 0a48.555 48.555 0 0 1 5.8 0M4.5 18h4.5a2.25 2.25 0 0 0 2.25-2.25V4.5A2.25 2.25 0 0 0 9 2.25H4.5A2.25 2.25 0 0 0 2.25 4.5v11.25A2.25 2.25 0 0 0 4.5 18Z" />
        </svg>
        <span>Visite</span>
        <span
          class="tab-badge ml-3 rounded-full bg-surface-secondary px-2.5 py-0.5 text-xs font-semibold text-text-subtle border border-border-default transition-colors">
          {{ folder.visits.all|length }}
        </span>
      </button>

      <!-- Recommandations -->
      <button hx-get="{% url 'inspections:folder_tab_recommandations' folder.id %}"
        class="tab-btn group inline-flex items-center border-b-2 border-transparent px-1 pb-4 text-sm font-medium text-text-subtle hover:border-border-hover hover:text-text-main transition-colors cursor-pointer">
        <svg class="mr-2 h-5 w-5 text-text-faded transition-colors" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 9v3.75m0-10.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.75c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.57-.598-3.75h-.152c-3.196 0-6.1-1.249-8.25-3.286Zm0 13.036h.008v.008H12v-.008Z" />
        </svg>
        <span>Recommandations</span>
        <span
          class="tab-badge ml-3 rounded-full bg-surface-secondary px-2.5 py-0.5 text-xs font-semibold text-text-subtle border border-border-default transition-colors">
          {{ folder.recommandations.all|length }}
        </span>
      </button>

    </nav>
  </div>
</div>

<div id="tab-content" class="min-h-[400px] mt-6">
  {% include 'inspections/partials/tab_overview.html' %}
</div>
{% endblock app_content %}
