{% extends "core/app_layout.html" %}

{% block page_title %}Dossiers{% endblock page_title %}

{% block app_content %}
<div class="w-full max-w-7xl px-4 sm:px-6 lg:px-8">

    <div class="sm:flex sm:items-center sm:justify-between mb-8">
        <div>
            <p class="mt-2 text-sm text-text-muted">Gestion de vos dossiers en temps réel.</p>
        </div>
        <div class="mt-4 sm:ml-16 sm:mt-0 sm:flex-none">
            <button type="button" hx-get="{% url 'inspections:create_folder_htmx' %}" hx-include="#form"
                hx-target="#modal-container"
                class="block rounded-md bg-brand-primary px-3.5 py-2 text-center text-sm font-semibold text-white hover:bg-brand-hover cursor-pointer transition">
                Nouveau dossier
            </button>
        </div>
    </div>

    <!-- Filter toolbar -->
    <div
        class="mb-8 px-6 bg-surface-primary border border-border-default rounded-2xl p-4 backdrop-blur-xs flex flex-col gap-4 transition-colors">
        <div class="flex items-center justify-between">
            <h2 class="text-xl font-bold text-text-main tracking-tight">Dossiers d'inspection</h2>
        </div>

        <form method="GET" action="." class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 items-end">

            <!-- Filter by Company -->
            <div class="flex flex-col gap-1.5">
                <label for="company"
                    class="text-xs font-semibold text-text-subtle uppercase tracking-wider">Client</label>
                <select name="company" id="company"
                    class="bg-surface-secondary border border-border-default text-text-main text-sm rounded-lg focus:ring-brand-primary focus:border-brand-primary block px-3 py-2 cursor-pointer outline-none transition w-full">
                    <option value="">Tous les clients</option>
                    {% for company in companies %}
                    <option value="{{ company.id }}" {% if request.GET.company == company.id|stringformat:"i" or request.POST.company == company.id|stringformat:"i" %}selected{% endif %}> {{ company.name }}
                    </option>
                    {% empty %}
                    <option value="" disabled>Aucun client disponible</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Filter by Phase -->
            <div class="flex flex-col gap-1.5">
                <label for="phase" class="text-xs font-semibold text-text-subtle uppercase tracking-wider">Phase</label>
                <select name="phase" id="phase"
                    class="bg-surface-secondary border border-border-default text-text-main text-sm rounded-lg focus:ring-brand-primary focus:border-brand-primary block px-3 py-2 cursor-pointer outline-none transition w-full">
                    <option value="">Toutes les phases</option>
                    {% for val, label in phase_choices %}
                    <option value="{{ val }}" {% if request.GET.phase == val or request.POST.phase == val %}selected{% endif%}>{{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <!-- Filter by Status (Active / Archived) -->
            <div class="flex flex-col gap-1.5">
                <label for="status" class="text-xs font-semibold text-text-subtle uppercase tracking-wider">État</label>
                <select name="status" id="status"
                    class="bg-surface-secondary border border-border-default text-text-main text-sm rounded-lg focus:ring-brand-primary focus:border-brand-primary block px-3 py-2 cursor-pointer outline-none transition">
                    <option value="">Tous les états</option>
                    <option value="active" {% if request.GET.status == 'active' %}selected{% endif %}>Actifs</option>
                    <option value="archived" {% if request.GET.status == 'archived' %}selected{% endif %}>Archivés
                    </option>
                </select>
            </div>

            <!-- Sorting menu + submit button -->
            <div class="flex items-center gap-2">
                <div class="flex flex-col gap-1.5 flex-1">
                    <label for="sort" class="text-xs font-semibold text-text-subtle uppercase tracking-wider">Trier
                        par</label>
                    <select name="sort" id="sort"
                        class="bg-surface-secondary border border-border-default text-text-main text-sm rounded-lg focus:ring-brand-primary focus:border-brand-primary block px-3 py-2 cursor-pointer outline-none transition">
                        <option value="-updated_at" {% if request.GET.sort == '-updated_at' or not request.GET.sort%}selected{% endif %}>Modifié (Récents)</option>
                        <option value="-created_at" {% if request.GET.sort == '-created_at' %}selected{% endif %}>Création
                        </option>
                        <option value="reference" {% if request.GET.sort == 'reference' %}selected{% endif %}>Référence(A-Z)</option>
                        <option value="company__name" {% if request.GET.sort == 'company__name' %}selected{% endif %}>Client (A-Z)</option>
                    </select>
                </div>

                <button type="submit"
                    class="bg-brand-primary hover:bg-brand-hover text-white font-semibold text-sm rounded-lg px-4 py-2 transition h-[38px] self-end cursor-pointer">
                    Filtrer
                </button>
            </div>

        </form>
    </div>

    <div id="folder-grid-container">
        {% include "inspections/partials/folder_grid.html" %}
    </div>

    <div id="modal-container"></div>

</div>

<script>
    document.body.addEventListener('closeModal', function () {
        const modal = document.getElementById('create-folder-modal');
        if (modal) modal.remove();
    });
</script>

{% endblock app_content %}
