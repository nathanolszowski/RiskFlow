{% extends "core/app_layout.html" %}

{% block title %}Dossiers d'inspection | RiskFlow{% endblock %}

{% block app_content %}
<div class="space-y-8">
    <!-- Header Section -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <p class="text-sm text-text-muted mt-1">Gérez et suivez l'ensemble de vos dossiers d'inspection.</p>
        </div>
        <div>
            <button hx-get="{% url 'inspections:create_folder' %}"
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    class="inline-flex items-center gap-2 rounded-xl bg-brand-primary px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-hover transition-colors shadow-lg cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Nouveau dossier
            </button>
        </div>
    </div>

    <!-- Filters and Search Bar -->
    <div class="bg-surface-primary border border-border-default rounded-2xl p-6 shadow-sm">
        <form id="folder-filter-form"
              hx-get="{% url 'inspections:folder_list_paginated' page=1 %}"
              hx-target="#folder-grid-container"
              hx-swap="innerHTML"
              hx-trigger="change from:select, keyup delay:400ms from:input[name='q']"
              class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">

            <!-- Global search -->
            <div class="lg:col-span-2">
                <label for="q" class="block text-xs font-medium text-text-muted mb-1">Recherche</label>
                <div class="relative">
                    <input type="text"
                           id="q"
                           name="q"
                           placeholder="Référence, entreprise..."
                           value="{{ request.GET.q|default:'' }}"
                           class="w-full rounded-xl border border-border-default bg-surface-secondary px-4 py-2 pl-10 text-sm text-text-main placeholder-text-muted focus:border-brand-primary focus:outline-none">
                    <svg class="w-4 h-4 absolute left-3.5 top-3 text-text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <!-- Filter by Phase -->
            <div>
                <label for="phase" class="block text-xs font-medium text-text-muted mb-1">Phase</label>
                <select id="phase"
                        name="phase"
                        class="w-full rounded-xl border border-border-default bg-surface-secondary px-3 py-2 text-sm text-text-main focus:border-brand-primary focus:outline-none">
                    <option value="">Toutes les phases</option>
                    {% for key, label in phase_choices %}
                    <option value="{{ key }}" {% if request.GET.phase == key %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Filter by status -->
            <div>
                <label for="status" class="block text-xs font-medium text-text-muted mb-1">Statut</label>
                <select id="status"
                        name="status"
                        class="w-full rounded-xl border border-border-default bg-surface-secondary px-3 py-2 text-sm text-text-main focus:border-brand-primary focus:outline-none">
                    <option value="">Tous les statuts</option>
                    <option value="active" {% if request.GET.status == 'active' %}selected{% endif %}>Actif</option>
                    <option value="archived" {% if request.GET.status == 'archived' %}selected{% endif %}>Archivé</option>
                </select>
            </div>

            <!-- Filter by companies -->
            <div>
                <label for="company" class="block text-xs font-medium text-text-muted mb-1">Entreprise</label>
                <select id="company"
                        name="company"
                        class="w-full rounded-xl border border-border-default bg-surface-secondary px-3 py-2 text-sm text-text-main focus:border-brand-primary focus:outline-none">
                    <option value="">Toutes les entreprises</option>
                    {% for comp in companies %}
                    <option value="{{ comp.id }}" {% if request.GET.company == comp.id|stringformat:"s" %}selected{% endif %}>
                        {{ comp.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </form>
    </div>

    <!-- Grid / Table Partial Container -->
    <div id="folder-grid-container">
        {% include "inspections/partials/folder_grid.html" %}
    </div>
</div>

<!-- HTMX modal container -->
<div id="modal-container"></div>
{% endblock app_content %}
