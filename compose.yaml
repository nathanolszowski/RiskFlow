# Local deployment: Django (gunicorn) + PostgreSQL, reachable from this PC only.
# Usage: see docs/riskflow-deploiement.md
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    image: riskflow:${RISKFLOW_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Override .env, which is also used to code with config.settings.dev
      DJANGO_SETTINGS_MODULE: config.settings.local
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - media:/data/media
      - logs:/data/logs
    # Published on this PC only, never on the network
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  media:
  logs:
